<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#062a52" />
  <title>Rhythm Runners</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>" />
  <style>
    html, body { margin: 0; height: 100%; background: #062a52; overscroll-behavior: none; touch-action: manipulation; }
    #root { height: 100%; }
    /* Gentle nudge to turn the phone sideways */
    #rotate { display: none; }
    @media (orientation: portrait) and (max-width: 700px) {
      #rotate {
        display: flex; position: fixed; inset: 0; z-index: 99; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; text-align: center;
        background: #062a52; color: #eaf6ff; font: 600 20px/1.3 system-ui, sans-serif; padding: 24px;
      }
      #rotate span { font-size: 64px; animation: tilt 1.6s ease-in-out infinite; }
      @keyframes tilt { 0%,30% { transform: rotate(0) } 60%,100% { transform: rotate(-90deg) } }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="rotate"><span>📱</span>Turn your phone sideways!</div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
